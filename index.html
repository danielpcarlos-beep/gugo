<!DOCTYPE html>
<html lang="pt-BR">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    
    <title>Gugo - O Seu Buscador Inteligente</title>
    <meta name="description" content="Faça suas pesquisas de forma rápida e prática no Gugo. O buscador feito para você.">
    <meta name="keywords" content="Gugo, pesquisa, busca, buscador, google, gugo app">
    <meta name="author" content="Gugo App">
    <meta name="robots" content="index, follow">

    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#202124" media="(prefers-color-scheme: dark)">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Gugo">

    <!-- Favicon e Ícones do App -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">

    <!-- Redes Sociais / Open Graph (Para WhatsApp, Instagram, Facebook) -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://gugo.app.br/">
    <meta property="og:title" content="Gugo - Pode Perguntar!">
    <meta property="og:description" content="Pesquise no Gugo de forma rápida e simples.">
    <meta property="og:image" content="https://gugo.app.br/estrela-vermelha.jpg">

    <!-- Estilos CSS -->
    <style>
        :root {
            color-scheme: light dark;
            --bg-color: #ffffff;
            --text-color: #202124;
            --border-color: #dfe1e5;
            --shadow-color: rgba(32, 33, 36, 0.18);
            --shadow-focus: rgba(32, 33, 36, 0.30);
            --btn-bg: #f8f9fa;
            --btn-border: #f8f9fa;
            --btn-text: #3c4043;
            --btn-hover-bg: #f1f3f4;
            --btn-hover-border: #dadce0;
            --placeholder-color: #757575;
            --footer-text: #70757a;
            --link-color: #1a0dab;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #202124;
                --text-color: #e8eaed;
                --border-color: #5f6368;
                --shadow-color: rgba(0, 0, 0, 0.35);
                --shadow-focus: rgba(0, 0, 0, 0.55);
                --btn-bg: #303134;
                --btn-border: #303134;
                --btn-text: #e8eaed;
                --btn-hover-bg: #3c4043;
                --btn-hover-border: #5f6368;
                --placeholder-color: #9aa0a6;
                --footer-text: #9aa0a6;
                --link-color: #8ab4f8;
            }
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            min-height: 100vh;
            margin: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 20px;
            transition: background-color 0.3s, color 0.3s;
        }

        .main-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 650px;
            margin: auto 0;
        }

        .logo-container {
            margin-bottom: 24px;
            text-align: center;
            width: 100%;
        }

        .logo-container img {
            max-width: 240px;
            width: 55%;
            height: auto;
            display: inline-block;
        }

        form {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        .search-box {
            width: 100%;
            padding: 14px 22px;
            font-size: 16px;
            background-color: var(--bg-color);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            border-radius: 28px;
            outline: none;
            box-shadow: 0 2px 8px var(--shadow-color);
            transition: box-shadow 0.2s, border-color 0.2s;
        }

        .search-box::placeholder {
            color: var(--placeholder-color);
        }

        .search-box:focus {
            box-shadow: 0 2px 12px var(--shadow-focus);
            border-color: transparent;
        }

        .buttons {
            margin-top: 22px;
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        .btn {
            background-color: var(--btn-bg);
            border: 1px solid var(--btn-border);
            border-radius: 6px;
            color: var(--btn-text);
            font-size: 14px;
            padding: 10px 20px;
            cursor: pointer;
            outline: none;
            transition: background-color 0.2s, border-color 0.2s, box-shadow 0.2s;
            font-weight: 500;
        }

        .btn:hover {
            background-color: var(--btn-hover-bg);
            border-color: var(--btn-hover-border);
            color: var(--text-color);
        }

        .banner-container {
            margin-top: 28px;
            text-align: center;
            width: 100%;
            max-width: 380px;
        }

        .banner-container img {
            width: 100%;
            height: auto;
            border-radius: 12px;
            box-shadow: 0 4px 14px var(--shadow-color);
            display: block;
        }

        /* Rodapé com Link do Instagram */
        footer {
            width: 100%;
            text-align: center;
            padding: 15px 0 5px 0;
            font-size: 13px;
            color: var(--footer-text);
        }

        footer a {
            color: var(--link-color);
            text-decoration: none;
            font-weight: 600;
        }

        footer a:hover {
            text-decoration: underline;
        }

        @media (max-width: 600px) {
            .logo-container img {
                max-width: 170px;
            }
            .banner-container {
                max-width: 280px;
                margin-top: 20px;
            }
            body {
                padding: 15px;
            }
        }
    </style>
</head>
<body>

    <div class="main-container">
        <!-- Logo Gugo Superior -->
        <div class="logo-container">
            <img src="gugo-logo.png" alt="Logo Gugo">
        </div>

        <!-- Formulário de Pesquisa -->
        <form action="https://www.google.com/search" method="GET" target="_blank">
            <input type="text" name="q" class="search-box" placeholder="Pesquise no Gugo..." required autofocus>
            <div class="buttons">
                <button type="submit" class="btn">Pesquisar no Gugo</button>
            </div>
        </form>

        <!-- Imagem da Estrela Vermelha / Banner Inferior -->
        <div class="banner-container">
            <!-- Certifique-se de que a foto da estrela vermelha está salva como 'estrela-vermelha.jpg' na mesma pasta -->
            <img src="estrela-vermelha.jpg" alt="Pode Perguntar!">
        </div>
    </div>

    <!-- Rodapé -->
    <footer>
        Siga o Gugo no Instagram: <a href="https://www.instagram.com/gugo.app" target="_blank" rel="noopener noreferrer">@gugo.app</a>
    </footer>

</body>
</html>
